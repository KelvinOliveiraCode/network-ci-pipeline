!
! Configuracao de REFERENCIA do switch core do laboratorio ficticio.
!
! Este arquivo e a Golden Config: o estado conhecido como bom do equipamento.
! O estagio `golden` compara o candidato contra ele e reprova o que divergir.
!
! CONTEUDO FICTICIO. Nenhum equipamento real e nenhum endereco publico.
!
hostname SW-CORE-LAB
!
! description documenta o papel do equipamento no plano.
description switch core do laboratorio ficticio
!
! --- VLANs ---------------------------------------------------------------
vlan 10
vlan 20
vlan 30
vlan 40
!
! --- acesso administrativo ------------------------------------------------
line vty 0 4
 password FICTICIO-SENHA-LAB
 transport input ssh
!
enable secret FICTICIO-SECRETO-LAB
!
username admin privilege 15 password FICTICIO-SENHA-LAB
!
! --- filtro de entrada ----------------------------------------------------
access-list 100 permit tcp any any eq 22
access-list 100 permit tcp any any eq 443
access-list 100 deny ip any any
!
! --- spanning-tree -------------------------------------------------------
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 priority 32768
!
! --- interfaces ----------------------------------------------------------
interface Vlan30
 description gerencia
 ip address 192.168.30.2 255.255.255.0
 no shutdown
!
interface Gi0/1
 description uplink para o firewall
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
!
interface Gi0/2
 description estacao
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface Gi0/3
 description servidor
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface Gi0/4
 description visitante
 switchport mode access
 switchport access vlan 40
 no shutdown
!
end