!
! Candidato 4 de 5 - DEVE SER REPROVADO NO ESTAGIO DE SINTAXE.
!
! O motivo do reprovamento e um `trun` onde se queria `trunk`. O arquivo esta
!inteiramente correto em regras de negocio: as VLANs batem com o golden, o
! filtro de entrada existe, nao ha rota insegura. Se o estagio de sintaxe
! falhar, os estagios seguintes nem rodam - e o relatorio tem que dizer isso.
!
! CONTEUDO FICTICIO.
!
hostname SW-CORE-LAB
!
! description documenta o papel do equipamento.
description switch core do laboratorio ficticio
!
! --- VLANs ---------------------------------------------------------------
vlan 10
vlan 20
vlan 30
vlan 40
!
! --- acesso administrativo ------------------------------------------------
line vty 0 4
 password FICTICIO-SENHA-LAB
 transport input ssh
!
enable secret FICTICIO-SECRETO-LAB
!
username admin privilege 15 password FICTICIO-SENHA-LAB
!
! --- filtro de entrada ----------------------------------------------------
access-list 100 permit tcp any any eq 22
access-list 100 permit tcp any any eq 443
access-list 100 deny ip any any
!
! --- spanning-tree -------------------------------------------------------
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 priority 32768
!
! --- interfaces ----------------------------------------------------------
interface Vlan30
 description gerencia
 ip address 192.168.30.2 255.255.255.0
 no shutdown
!
interface Gi0/1
 description uplink para o firewall
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
!
! O erro esta aqui: 'trun' nao e modo de porta valido. A pista mais forte de
! que o erro e de digitacao e o fato de a interface ao lado estar correta.
interface Gi0/2
 description estacao
 switchport mode trun
 switchport access vlan 10
 no shutdown
!
interface Gi0/3
 description servidor
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface Gi0/4
 description visitante
 switchport mode access
 switchport access vlan 40
 no shutdown
!
end