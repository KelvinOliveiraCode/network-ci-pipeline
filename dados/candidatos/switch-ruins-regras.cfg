!
! Candidato 5 de 5 - DEVE SER REPROVADO NO ESTAGIO DE REGRAS DE NEGOCIO.
!
! Este arquivo e sintaticamente perfeito: todo comando existe, todo numero e
! numero, todo bloco de interface tem subcomandos. O que ele tem de errado e
! de negocio, e sao tres problemas que so quem conhece o plano de enderecamento
! do laboratorio percebe:
!
!   1. A VLAN 10 aparece duas vezes. O equipamento aceita a segunda e ignora
!      o nome, entao o YAML de origem e o equipamento passam a discordar.
!   2. A rota padrao aponta para um endereco que e a propria interface de
!      destino: o pacote nunca sai.
!   3. A ACL 100 existe, mas SEM a linha final `deny ip any any`. Fica
!      implicito o comportamento padrao, que em ACL e permitir.
!
! CONTEUDO FICTICIO.
!
hostname SW-CORE-LAB
!
! description documenta o papel do equipamento.
description switch core do laboratorio ficticio
!
! --- VLANs ---------------------------------------------------------------
vlan 10
 name CORPORATIVO
vlan 10
 name CORPORATIVO-DUPLICADA
vlan 20
vlan 30
vlan 40
!
! --- acesso administrativo ------------------------------------------------
line vty 0 4
 password FICTICIO-SENHA-LAB
 transport input ssh
!
enable secret FICTICIO-SECRETO-LAB
!
username admin privilege 15 password FICTICIO-SENHA-LAB
!
! --- filtro de entrada, SEM o deny final --------------------------------
access-list 100 permit tcp any any eq 22
access-list 100 permit tcp any any eq 443
!
! --- rota padrao -------------------------------------------------------
ip route 0.0.0.0 255.255.255.0 192.168.20.1
ip route 0.0.0.0 255.255.255.0 192.168.10.1
!
! --- spanning-tree -------------------------------------------------------
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 priority 32768
!
! --- interfaces ----------------------------------------------------------
interface Vlan30
 description gerencia
 ip address 192.168.30.2 255.255.255.0
 no shutdown
!
interface Gi0/1
 description uplink para o firewall
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
!
interface Gi0/2
 description estacao
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface Gi0/3
 description servidor
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface Gi0/4
 description visitante
 switchport mode access
 switchport access vlan 40
 no shutdown
!
end